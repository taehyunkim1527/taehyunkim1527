<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taehyun Kim | Systems Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #2980b9;
            --text-color: #333;
            --bg-color: #fff;
            --sidebar-width: 280px;
            --section-padding: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lora', serif;
            color: var(--text-color);
            line-height: 1.7;
            background-color: #f9f9f9;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Inter', sans-serif;
            color: var(--primary-color);
            margin-bottom: 0.5em;
            font-weight: 700;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        a:hover {
            text-decoration: underline;
            color: #1a5276;
        }

        /* Layout */
        .wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-right: 1px solid #eaeaea;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 1000;
        }

        .profile-section {
            text-align: center;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px auto;
            background-color: #eee;
            border: 3px solid #f1f1f1;
        }

        .name {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .role {
            font-size: 0.9rem;
            color: #777;
            font-family: 'Inter', sans-serif;
            margin-bottom: 20px;
        }

        .nav-menu {
            list-style: none;
            margin-top: 30px;
            text-align: left;
        }

        .nav-menu li {
            margin-bottom: 15px;
        }

        .nav-menu a {
            color: #555;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            display: block;
            padding: 5px 0;
            text-decoration: none;
        }

        .nav-menu a:hover, .nav-menu a.active {
            color: var(--accent-color);
            font-weight: 600;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .social-links a {
            color: #777;
            font-size: 1.2rem;
        }

        .social-links a:hover {
            color: var(--accent-color);
        }

        .contact-info {
            font-size: 0.8rem;
            color: #888;
            margin-top: 20px;
            font-family: 'Inter', sans-serif;
        }

        /* Main Content */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            background: #fff;
        }

        section {
            padding: 80px 60px;
            border-bottom: 1px solid #f0f0f0;
            max-width: 900px;
            margin: 0 auto;
        }

        section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 40px;
            position: relative;
            padding-bottom: 15px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 4px;
            background: var(--accent-color);
        }

        /* Timeline Items (Experience & Education) */
        .timeline-item {
            margin-bottom: 40px;
            position: relative;
            padding-left: 20px;
            border-left: 2px solid #eee;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .timeline-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2c3e50;
        }

        .timeline-meta {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: #777;
        }

        .timeline-subtitle {
            font-size: 1rem;
            font-style: italic;
            color: #555;
            margin-bottom: 10px;
        }

        /* Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }

        .skill-category h4 {
            font-size: 1.1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .skill-list {
            list-style: none;
            font-size: 0.95rem;
        }

        .skill-list li {
            margin-bottom: 8px;
            padding-left: 15px;
            position: relative;
        }

        .skill-list li::before {
            content: '•';
            color: var(--accent-color);
            position: absolute;
            left: 0;
        }

        /* Publication List */
        .pub-item {
            margin-bottom: 30px;
        }

        .pub-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #2c3e50;
            display: block;
            margin-bottom: 5px;
        }

        .pub-authors {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 5px;
        }

        .pub-venue {
            font-style: italic;
            color: #777;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .pub-links a {
            display: inline-block;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            border: 1px solid var(--accent-color);
            padding: 2px 10px;
            border-radius: 15px;
            margin-right: 5px;
        }

        .pub-links a:hover {
            background: var(--accent-color);
            color: #fff;
            text-decoration: none;
        }

        .tag-highlight {
            background-color: #e8f4f8;
            color: #2980b9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            .wrapper {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid #eaeaea;
                padding: 30px;
            }

            .profile-section {
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: left;
                margin-bottom: 20px;
            }

            .profile-img {
                width: 110px;
                height: 110px;
                margin: 0 25px 0 0;
            }

            .main-content {
                margin-left: 0;
            }

            .nav-menu {
                display: flex;
                flex-wrap: wrap;
                gap: 20px;
                justify-content: center;
            }
            
            section {
                padding: 50px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="profile-section">
                <!-- Placeholder for profile image -->
                <div class="profile-img" style="background: #e0e0e0 url('assets/portfolio.png') center/cover no-repeat;"></div>
                <div class="profile-info">
                    <h1 class="name">Taehyun Kim, Ph.D.</h1>
                    <p class="role">Systems Software Engineer<br>Specializing in AI, DPU & Storage</p>
                </div>
            </div>

            <nav>
                <ul class="nav-menu">
                    <li><a href="#about">About</a></li>
                    <li><a href="#experience">Experience</a></li>
                    <li><a href="#education">Education</a></li>
                    <li><a href="#skills">Skills</a></li>
                    <li><a href="#publications">Publications</a></li>
                    <li><a href="#projects">Projects</a></li>
                </ul>
            </nav>

            <div class="footer-info">
                <div class="social-links">
                    <a href="mailto:taehyunkim1527@gmail.com" title="Email"><i class="fas fa-envelope"></i></a>
                    <a href="https://github.com/taehyunkim1527" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
                    <a href="https://www.linkedin.com/in/taehyun-kim-9a9911126/" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {{ content }}
        </main>
    </div>

</body>
</html>
